  #tourbar #tourLabel { font-size: 13px; min-width: 120px; text-align: center; padding: 0 6px; }

  #joystick { position: fixed; left: 26px; bottom: 30px; width: 116px; height: 116px; z-index: 30; border-radius: 50%; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); display: none; touch-action: none; }

  #toast.show { opacity: 1; }
  /* 窄視窗：縮小小地圖、聊天框上移、導覽列置中，避免重疊 */
  @media (max-width: 860px) {

/* ===== 載入展覽 ===== */
const params = new URLSearchParams(location.search);
const exId = params.get('id'), wantEdit = params.get('edit') === '1';
const DEMO = Object.assign({ id: null }, window.STARTER_EXHIBITION ? STARTER_EXHIBITION('示範展覽 · 基礎展覽空間') : { title: '示範展覽', style: {}, rooms: [] });

const isOwner = !!(fromStore && me && EX.ownerId === me.id);

// ---- 多房間：把舊的單一 items 遷移成 rooms[]，確保每件展品有 id ----
function ensureItemIds(items) { for (const it of (items || [])) if (!it.id) it.id = (window.Store ? Store.newId('it') : 'it' + Math.round(performance.now()) + Math.random().toString(36).slice(2, 6)); }
function ensureRooms(ex) {
  if (!ex.rooms || !ex.rooms.length) ex.rooms = [{ id: 'rm0', name: '展廳 1', template: ex.template || 'white', items: ex.items || [] }];
  ex.rooms.forEach((rm, i) => { if (!rm.id) rm.id = 'rm' + i; if (!rm.name) rm.name = '展廳 ' + (i + 1); if (!rm.items) rm.items = []; if (!rm.template) rm.template = ex.template || 'white'; ensureItemIds(rm.items); });
}
ensureRooms(EX);
let roomIdx = Math.min(Math.max(0, parseInt(params.get('room') || '0', 10) || 0), EX.rooms.length - 1);
let room = EX.rooms[roomIdx];

  const px = x => ox + (x + hw) * s, py = z => oy + (z + hd) * s;
  mmx.clearRect(0, 0, W, W);
  mmx.fillStyle = 'rgba(255,255,255,.06)'; mmx.fillRect(ox, oy, rw, rh);
  mmx.strokeStyle = 'rgba(255,255,255,.4)'; mmx.lineWidth = 1.5; mmx.strokeRect(ox, oy, rw, rh);
  for (const d of EX.items) {
    let x, z; if (FLOOR_ITEM[d.type]) { x = px(d.x); z = py(d.z); } else if (d.mount) { x = px(d.mount.p[0]); z = py(d.mount.p[2]); } else { const sl = wallSlot(d.wall, d.offset, 0).pos; x = px(sl[0]); z = py(sl[2]); }
    mmx.fillStyle = MM_COLORS[d.type] || '#888'; mmx.beginPath(); mmx.arc(x, z, 3.2, 0, 7); mmx.fill();
  }
  // 玩家
  const px0 = px(yawObj.position.x), py0 = py(yawObj.position.z);
  mmx.save(); mmx.translate(px0, py0); mmx.rotate(-yaw);
  mmx.fillStyle = '#ffd34d'; mmx.beginPath(); mmx.moveTo(0, -7); mmx.lineTo(-5, 5); mmx.lineTo(5, 5); mmx.closePath(); mmx.fill(); mmx.restore();
}

/* ===== 導覽動線 ===== */
const tourbar = document.getElementById('tourbar'), tourBtn = document.getElementById('tourBtn'), tourLabel = document.getElementById('tourLabel');
const tour = { active: false, idx: 0, list: [], tween: null, lastSection: null };
function tourStops() { return EX.items.map((d, i) => i).filter(i => isInteractive(EX.items[i])); }
// 展品在世界中的位置與「面向房間」的法向量
function stopWorld(i) {
  const d = EX.items[i];
  if (d.type === 'model' || d.type === 'hotspot' || d.type === 'prop') return { item: new THREE.Vector3(d.x, d.type === 'prop' ? (d.y || 0) + 0.5 : (d.height ?? 1.4), d.z), n: new THREE.Vector3(0, 0, 1) };
  if (d.mount) return { item: new THREE.Vector3(d.mount.p[0], d.mount.p[1], d.mount.p[2]), n: new THREE.Vector3(Math.sin(d.mount.ry), 0, Math.cos(d.mount.ry)) };
  const sl = wallSlot(d.wall, d.offset, d.height ?? 1.7).pos; return { item: new THREE.Vector3(sl[0], sl[1], sl[2]), n: wallNormal(d.wall) };
}
function tourPose(i) {
  const { item, n } = stopWorld(i);
  const target = item.clone().addScaledVector(n, 3.0); target.y = EYE;
  target.x = THREE.MathUtils.clamp(target.x, -hw + MARGIN, hw - MARGIN); target.z = THREE.MathUtils.clamp(target.z, -hd + MARGIN, hd - MARGIN);
  const dir = new THREE.Vector3(item.x - target.x, 0, item.z - target.z).normalize();
  const tyaw = Math.atan2(-dir.x, -dir.z);
  const tpitch = Math.atan2(item.y - EYE, Math.hypot(item.x - target.x, item.z - target.z));
  return { pos: target, yaw: tyaw, pitch: tpitch };
}
/* 導覽編號標記（漂浮在每個導覽站上方）*/
const markerGroup = new THREE.Group(); markerGroup.visible = false; scene.add(markerGroup);
function numberSprite(n, active) {
  const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');
  g.beginPath(); g.arc(64, 64, 52, 0, 7); g.fillStyle = active ? '#ffd34d' : 'rgba(255,255,255,0.92)'; g.fill();
  g.lineWidth = 4; g.strokeStyle = 'rgba(0,0,0,0.18)'; g.stroke();
  g.fillStyle = '#1a1a1f'; g.font = '700 52px -apple-system, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(String(n), 64, 66);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true, depthTest: false })); s.scale.setScalar(0.42); s.renderOrder = 5; return s;
}
function rebuildMarkers() {
  while (markerGroup.children.length) markerGroup.remove(markerGroup.children[0]);
  tour.list.forEach((i, k) => { const { item, n } = stopWorld(i); const s = numberSprite(k + 1, k === tour.idx); s.position.copy(item).addScaledVector(n, 0.25); s.position.y = Math.min(R.height - 0.3, item.y + (EX.items[i].size ? EX.items[i].size.h / 2 : 0.6) + 0.45); markerGroup.add(s); });
}
/* 地面引導光點（從腳下流向下一站）*/
const guideGroup = new THREE.Group(); guideGroup.visible = false; scene.add(guideGroup);
const guideDots = []; for (let k = 0; k < 30; k++) { const m = new THREE.Mesh(new THREE.CircleGeometry(0.055, 14), new THREE.MeshBasicMaterial({ color: '#ffd34d', transparent: true, opacity: 0.85, depthWrite: false })); m.rotation.x = -Math.PI / 2; m.position.y = 0.012; guideGroup.add(m); guideDots.push(m); }
function updateGuide() {
  if (!tour.active || tour._target == null) { guideGroup.visible = false; return; }
  const tw = tour.tween || tourPose(tour._target); const tx = tw.pos.x, tz = tw.pos.z;
  const px = yawObj.position.x, pz = yawObj.position.z, dist = Math.hypot(tx - px, tz - pz);
  if (dist < 0.9) { guideGroup.visible = false; return; }
  guideGroup.visible = true; const step = 0.55, off = (tms * 1.4) % step;
  guideDots.forEach((m, k) => { const s = off + k * step; if (s >= dist) { m.visible = false; return; } m.visible = true; const t = s / dist; m.position.x = px + (tx - px) * t; m.position.z = pz + (tz - pz) * t; m.material.opacity = 0.25 + 0.6 * Math.min(1, s / 1.2) * (1 - t * 0.5); });
}
/* 章節標題卡 */
const chapterCard = document.getElementById('chapterCard'); let chapterTimer = null;
function showChapter(sec, k) {
  chapterCard.querySelector('.k').textContent = EX.title || ''; chapterCard.querySelector('.t').textContent = sec;
  chapterCard.classList.add('show'); clearTimeout(chapterTimer); chapterTimer = setTimeout(() => chapterCard.classList.remove('show'), 2600);
}
function sectionIndex(sec) { const seen = []; for (const i of tour.list) { const s = EX.items[i].section || ''; if (s && !seen.includes(s)) seen.push(s); } return Math.max(0, seen.indexOf(sec)); }
function gotoStop(k) {
  tour.list = tourStops(); if (!tour.list.length) return;
  tour.idx = (k + tour.list.length) % tour.list.length;
  const i = tour.list[tour.idx], d = EX.items[i];
  tour.tween = tourPose(i); tour.active = true; infoEl.classList.remove('open');
  const sec = d.section || '';
  tourLabel.textContent = (sec ? sec + ' · ' : '') + `${tour.idx + 1} / ${tour.list.length} · ${d.title || ''}`;
  if (sec && sec !== tour.lastSection) showChapter(sec, sectionIndex(sec));
  tour.lastSection = sec;
  tour._target = i; rebuildMarkers(); markerGroup.visible = true;
}
function startTour() { tour.lastSection = null; tourbar.classList.add('show'); tourBtn.classList.add('on'); mapOn = true; minimap.classList.add('show'); gotoStop(tour.idx || 0); }   // 從上次中斷的站續播
function exitTour() { tour.active = false; tour.tween = null; tour._target = null; tourbar.classList.remove('show'); tourBtn.classList.remove('on'); markerGroup.visible = false; guideGroup.visible = false; document.getElementById('focusVig').classList.remove('show'); }
tourBtn.onclick = () => tour.active ? exitTour() : startTour();
document.getElementById('tourPrev').onclick = () => gotoStop(tour.idx - 1);
document.getElementById('tourNext').onclick = () => gotoStop(tour.idx + 1);
document.getElementById('tourExit').onclick = exitTour;
function angLerp(a, b, t) { const d = Math.atan2(Math.sin(b - a), Math.cos(b - a)); return a + d * t; }
function updateTour() {
  if (!tour.tween) return;
  const tw = tour.tween, k = 0.08;
  yawObj.position.x += (tw.pos.x - yawObj.position.x) * k;
  yawObj.position.z += (tw.pos.z - yawObj.position.z) * k;
  yaw = angLerp(yaw, tw.yaw, k); pitch += (tw.pitch - pitch) * k; applyLook();
  if (Math.abs(tw.pos.x - yawObj.position.x) < 0.03 && Math.abs(tw.pos.z - yawObj.position.z) < 0.03) {
    tour.tween = null; if (tour._target != null) openInfo(tour._target);
  }
}

/* ===== 背景音樂 ===== */
let bgmAudio = null, muted = false;
const muteBtn = document.getElementById('muteBtn');
function setupBgm() { if (!STYLE.bgm) { if (bgmAudio) bgmAudio.pause(); bgmAudio = null; muteBtn.classList.add('hidden'); return; } if (!bgmAudio) bgmAudio = new Audio(); if (bgmAudio.src !== STYLE.bgm) bgmAudio.src = STYLE.bgm; bgmAudio.loop = true; bgmAudio.volume = STYLE.bgmVolume; muteBtn.classList.remove('hidden'); }
muteBtn.onclick = () => { muted = !muted; muteBtn.textContent = muted ? '已靜音' : '音樂'; if (bgmAudio) { if (muted) bgmAudio.pause(); else bgmAudio.play().catch(() => {}); } };

/* ===== 視角切換 + 聊天泡泡 ===== */
const viewBtn = document.getElementById('viewBtn');
function setView(tp) {
  thirdPerson = tp; avatar.visible = tp;
  camera.position.set(0, tp ? 0.9 : 0, tp ? 4.4 : 0);
  viewBtn.classList.toggle('on', tp); viewBtn.textContent = tp ? '第一人稱' : '第三人稱';
}
viewBtn.onclick = () => setView(!thirdPerson);

const chatBar = document.getElementById('chatBar'), chatInput = document.getElementById('chatInput'), chatBubble = document.getElementById('chatBubble');
let bubbleText = '', bubbleUntil = 0;
chatInput.addEventListener('keydown', e => {
  e.stopPropagation();
  if (e.key === 'Enter') { const t = chatInput.value.trim(); if (t) { bubbleText = t; bubbleUntil = tms + 6; if (!thirdPerson) setView(true); } chatInput.value = ''; chatInput.blur(); }
  if (e.key === 'Escape') chatInput.blur();
});
const _proj = new THREE.Vector3();
function updateAvatarAndChat() {
  // 化身永遠跟著玩家位置與朝向（第一人稱時隱藏）
  avatar.position.set(yawObj.position.x, 0, yawObj.position.z);
  avatar.rotation.y = yaw + Math.PI;
  // 聊天泡泡：投影頭頂世界座標到螢幕
  if (bubbleText && tms < bubbleUntil) {
    _proj.set(yawObj.position.x, 2.05, yawObj.position.z).project(camera);
    if (_proj.z < 1) {
      chatBubble.textContent = bubbleText;
      chatBubble.style.left = ((_proj.x * 0.5 + 0.5) * innerWidth) + 'px';
      chatBubble.style.top = ((-_proj.y * 0.5 + 0.5) * innerHeight) + 'px';
      chatBubble.classList.add('show');
    } else chatBubble.classList.remove('show');
  } else chatBubble.classList.remove('show');
}

/* ===== 主迴圈 ===== */
let focused = -1, tms = 0;
let warpCooldown = false;
function checkDoors() {
  if (isEdit) return;
  let nearAny = false;
  for (const d of EX.items) {
    if (d.type !== 'prop' || d.shape !== 'doorway') continue;
    const dist = Math.hypot(yawObj.position.x - d.x, yawObj.position.z - d.z);
    if (dist < 2) nearAny = true;
    if (dist < 1.0 && !warpCooldown && d.target != null && +d.target !== roomIdx) { warpCooldown = true; switchRoom(+d.target); return; }
  }
  if (!nearAny) warpCooldown = false;
}
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05); tms += dt;
  if (tour.active && tour.tween) updateTour();
  else if (!isEdit || !itemDrag) updateMovement(dt);
  checkDoors();
  for (const a of animated) a.obj.rotation.y += a.spin * dt;
  for (const p of pulses) p.obj.scale.setScalar(1 + Math.sin(tms * 2.4) * 0.18);
  if (!isEdit) {
    focused = pickIndex(centerNDC, 6); const hot = focused >= 0 && isInteractive(EX.items[focused]);
    crosshair.classList.toggle('hot', hot); if (isTouch) tapHint.classList.toggle('show', hot);
    const tip = document.getElementById('aimTip');   // 準心對到作品 → 顯示名稱
    if (hot && !infoEl.classList.contains('open')) { const fd = EX.items[focused]; tip.innerHTML = '<b>' + String(fd.title || '').replace(/</g, '&lt;') + '</b>' + (isTouch ? '' : ' · 點一下查看'); tip.classList.add('show'); }
    else tip.classList.remove('show');
  }
  else { crosshair.classList.remove('hot'); document.getElementById('aimTip').classList.remove('show'); if (isTouch) tapHint.classList.remove('show'); }
  if (boxHelper.visible && selected >= 0 && built[selected]) boxHelper.update();
  updateAvatarAndChat(); updateGuide();
  document.getElementById('focusVig').classList.toggle('show', tour.active && !tour.tween && infoEl.classList.contains('open'));
  if (mapOn && minimap.classList.contains('show')) drawMinimap();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}

/* ===== 開場 ===== */
const intro = document.getElementById('intro'), enterBtn = document.getElementById('enterBtn');
document.title = EX.title || '觀展';
document.getElementById('introTitle').textContent = EX.title || '展覽';
document.getElementById('introSub').textContent = isTouch ? '左下搖桿移動，滑右側畫面轉視角。可開小地圖、按「導覽」自動帶你逛。走近展品點一下互動。' : '按住滑鼠左鍵拖曳轉視角，W/A/S/D 移動。可開小地圖、按「導覽」自動帶你逛。準心對準展品點一下互動、按讚、留言。';
document.getElementById('controlsHint').innerHTML = isTouch ? '' : '<kbd>W</kbd> 前進 <kbd>S</kbd> 後退 <kbd>A</kbd> <kbd>D</kbd> 左右 &nbsp;·&nbsp; 按住左鍵 轉視角 &nbsp;·&nbsp; 點擊展品 互動';
const topbar = document.getElementById('topbar');
topbar.querySelector('.title').textContent = EX.title || '展覽';
refreshCount(); renderRoomBar();
tourBtn.classList.remove('hidden'); mapBtn.classList.remove('hidden');
if (isOwner) { editToggle.classList.remove('hidden'); if (isTouch) editToggle.textContent = '編輯（建議用電腦）'; }
THREE.DefaultLoadingManager.onProgress = (u, l, t) => { document.querySelector('#loadBar > i').style.width = Math.round(l / t * 100) + '%'; };
function ready() { document.querySelector('#loadBar > i').style.width = '100%'; document.getElementById('enterRow').classList.remove('hidden'); document.getElementById('loadBar').classList.add('hidden'); }
THREE.DefaultLoadingManager.onLoad = ready; setTimeout(ready, 900);
function enterExhibition(withTour) {
  intro.classList.add('hidden'); topbar.classList.add('show'); crosshair.classList.add('show');
  minimap.classList.add('show'); chatBar.classList.add('show');
  capturePortals(); applyPortals();   // 渲染各房間快照，貼到門戶窗上
  for (const it of (EX.items || [])) if (it._video) it._video.play().catch(() => {});
  setupBgm(); if (bgmAudio && !muted) bgmAudio.play().catch(() => {});
  if (isOwner && wantEdit && !isTouch) enterEdit();
  else if (withTour) startTour();
}
enterBtn.addEventListener('click', () => enterExhibition(false));
document.getElementById('tourEnterBtn').addEventListener('click', () => enterExhibition(true));
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
applyLook(); tick();

/* ===== 即時協作：訂閱這檔展覽，協作者的變更即時同步進場景 ===== */
if (EX.id) {
  const tryWatch = setInterval(() => {
    if (!window.Cloud || !Cloud.enabled) return;
    clearInterval(tryWatch);
    Cloud.watch(EX.id, () => {
      if (itemDrag) return;   // 拖曳中先不動，放開後下一次更新會套用
      const fresh = Store.get(EX.id); if (!fresh) return;
      EX.rooms = fresh.rooms; EX.style = fresh.style || EX.style; ensureRooms(EX);
      roomIdx = Math.min(roomIdx, EX.rooms.length - 1); room = EX.rooms[roomIdx]; EX.items = room.items;
      lastSnap = isEdit ? JSON.stringify(EX.items) : null;
      buildRoomGeometry(); rebuildAll(); refreshCount(); renderRoomBar();
      showToast('已同步協作者的變更', 2200);
    });
  }, 800);
}
</script>
